<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>git hub delete</title>
</head>
<body>
    <h1 id="secret-key">My secret info
    </h1>
    <input id="input-delete" placeholder="" type="text">
    <button id="btn-delete" disabled >Delete</button>
    <script>
        document.getElementById('input-delete')
        .addEventListener('keyup',function(event){
            const text = event.target.value;
            const btnDelete = document.getElementById('btn-delete');
            const secretTag = document.getElementById('secret-key')
            if (text==='delete') {
                console.log('delete typed');
                btnDelete.removeAttribute('disabled');
               
                
                
            }
            else {
                console.log('something else')
                btnDelete.setAttribute('disabled',true);
            }
            btnDelete.addEventListener('click',function(){
                     secretTag.style.display='none';
                });
               
        })
    </script>
</body>
</html>
